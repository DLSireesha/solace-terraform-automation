name: Terraform CI/CD

on:
  push:
    branches : ["main"]
  pull_request:
    branches: ["main"]

jobs:
  broker-service:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform -chdir=broker-service init

      - name: Terraform Validate
        run: terraform -chdir=broker-service validate

      - name: Terraform plan
        run: |
          terraform -chdir=broker-service plan \
              -var "solacebroker_username=${{ secrets.SOLACEBROKER_USERNAME }}" \
              -var "solacebroker_password=${{ secrets.SOLACEBROKER_PASSWORD }}" \
              -var "solacebroker_url=${{ secrets.SOLACEBROKER_URL }}" \
              -var "msg_vpn_name=${{ secrets.MSG_VPN_NAME }}"
      - name: Terraform Apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          terraform -chdir=broker-service apply -auto-approve \
               -var "solacebroker_username=${{ secrets.SOLACEBROKER_USERNAME }}" \
              -var "solacebroker_password=${{ secrets.SOLACEBROKER_PASSWORD }}" \
              -var "solacebroker_url=${{ secrets.SOLACEBROKER_URL }}" \
              -var "msg_vpn_name=${{ secrets.MSG_VPN_NAME }}"

  monitoring:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Terraform Init
        run: terraform -chdir=monitoring init

      - name: Terraform Validate
        run: terraform -chdir=monitoring validate

      - name: Terraform Plan
        run: | 
          terraform -chdir=monitoring plan \
             -var "datadog_api_key=${{ secrets.DATADOG_API_KEY }}" \
             -var "datadog_app_key=${{ secrets.DATADOG_APP_KEY }}"

      - name: Terraform Apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          terraform -chdir=monitoring apply -auto-approve \
             -var "datadog_api_key=${{ secrets.DATADOG_API_KEY }}" \
             -var "datadog_app_key=${{ secrets.DATADOG_APP_KEY }}"

